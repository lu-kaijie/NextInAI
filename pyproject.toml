[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextinai"
version = "0.2.0"
description = "面向 AI 情报追踪、事件归并与主动交付的个人 harness。"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.7,<14.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "openai>=1.30,<2.0",
  "apscheduler>=3.10,<4.0",
  "email-validator>=2.1,<3.0",
  "python-dateutil>=2.9,<3.0",
  "reportlab>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.4,<1.0",
]

[project.scripts]
nextinai = "nextinai.cli.app:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
